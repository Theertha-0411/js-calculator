<!DOCTYPE html>
<html>
<head>
    <title>Simple Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            padding-top: 60px;
        }
        .calc-box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            width: 300px;
        }
        input {
            width: 85%;
            padding: 10px;
            margin: 8px 0;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        button {
            padding: 10px 16px;
            margin: 6px 3px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
        }
        button:hover { background-color: #0056b3; }
        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            color: #2c3e50;
        }
    </style>
</head>
<body>
    <div class="calc-box">
        <h2>Calculator</h2>
        <input type="number" id="num1" placeholder="First number">
        <input type="number" id="num2" placeholder="Second number">
        <div>
            <button onclick="calculate('+')">+</button>
            <button onclick="calculate('-')">-</button>
            <button onclick="calculate('*')">×</button>
            <button onclick="calculate('/')">÷</button>
        </div>
        <div id="result">Result: 0</div>
    </div>

    <script>
        function calculate(operator) {
            let n1 = parseFloat(document.getElementById('num1').value);
            let n2 = parseFloat(document.getElementById('num2').value);
            let answer = 0;

            if (isNaN(n1) || isNaN(n2)) {
                document.getElementById('result').innerText = "Please enter both numbers!";
                return;
            }

            if (operator === '+') answer = n1 + n2;
            if (operator === '-') answer = n1 - n2;
            if (operator === '*') answer = n1 * n2;
            if (operator === '/') {
                answer = n2 !== 0 ? (n1 / n2).toFixed(2) : "Cannot divide by 0";
            }

            document.getElementById('result').innerText = "Result: " + answer;
        }
    </script>
</body>
</html>
